<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS JS Praktika</title>
    <link rel="stylesheet" href="en yeni.css">
</head>

<body>

    <header>
        <div class="logo">dfvfgg</div>

        <div class="menu-toggle">☰</div>

        <nav>
            <ul>
                <li><a href="#home">Ana səhifə</a></li>
                <li><a href="#cards">Xidmətlər</a></li>
                <li><a href="#contact">Əlaqə</a></li>
            </ul>
        </nav>

        <button id="darkMode">🌙</button>
    </header>

    <section class="hero" id="home">
        <div class="hero-text">
            <h1>HTML CSS Praktika Saytı</h1>
            <p>HTML, CSS və JavaScript öyrənmək üçün layihə.</p>
            <button id="startBtn">Başla</button>
        </div>

        <div class="hero-image">
            <img src="https://picsum.photos/400/250" alt="">
        </div>
    </section>

    <section class="cards" id="cards">
        <div class="card">HTML</div>
        <div class="card">CSS</div>
        <div class="card">JavaScript</div>
    </section>

    <section class="grid-section">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </section>

    <section class="contact" id="contact">
        <h2>Əlaqə</h2>

        <input id="name" type="text" placeholder="Ad">
        <input id="email" type="email" placeholder="Email">
        <textarea id="message" placeholder="Mesaj"></textarea>

        <button id="sendBtn">Göndər</button>

        <p id="msg"></p>
    </section>

    <footer>
        © 2026 Praktika Saytı
    </footer>

    <script src="en yeni.js"></script>

</body>

</html>
